<script>
    // Wait for the document to be fully loaded
    document.addEventListener("DOMContentLoaded", function () {
        // Create a new div element to hold the dynamic content
        var newContainer = document.createElement("div");
        newContainer.classList.add("custom-banner");
        newContainer.innerHTML = `
          <div class="banner">
              <img src="/images/ladal_icon_white.png" alt="Icon" class="banner-icon">
              <span class="banner-text">Language Technology and Data Analysis Laboratory</span>
          </div>
      `;
        var header = document.getElementById("quarto-header");
        var navbar = header.querySelector("nav");
        header.insertBefore(newContainer, navbar);

        // ── Per-page Open Graph tag overrides ────────────────────────────────
        // Quarto renders the page title into <title> and (with our injected
        // top-level description: field) into <meta name="description">.
        // We read those values and overwrite the static OG/Twitter defaults
        // so that each tutorial page gets its own rich social preview.

        var pageTitle = document.title || "";
        var descMeta  = document.querySelector('meta[name="description"]');
        var pageDesc  = descMeta ? descMeta.getAttribute("content") : "";
        var pageUrl   = window.location.href;

        function setMeta(selector, attr, value) {
            if (!value) return;
            var el = document.querySelector(selector);
            if (el) el.setAttribute(attr, value);
        }

        // Open Graph
        setMeta('meta[property="og:title"]',       "content", pageTitle);
        setMeta('meta[property="og:description"]', "content", pageDesc);
        setMeta('meta[property="og:url"]',         "content", pageUrl);

        // Twitter / X Card
        setMeta('meta[name="twitter:title"]',       "content", pageTitle);
        setMeta('meta[name="twitter:description"]', "content", pageDesc);
    });
</script>

<!-- ============================================================
     LADAL — Open Graph & Twitter Card meta tags
     Default values — overridden per-page by the JS above once
     the page title and description are known at runtime.
     ============================================================ -->

<meta property="og:site_name" content="LADAL" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://ladal.edu.au" />
<meta property="og:title" content="LADAL — Language Technology and Data Analysis Laboratory" />
<meta property="og:description" content="Free, open-access tutorials, tools, and courses for language researchers at all levels." />
<meta property="og:image" content="https://ladal.edu.au/images/uq1.webp" />
<meta property="og:image:alt" content="Great Court, The University of Queensland — LADAL" />
<meta property="og:locale" content="en_AU" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="LADAL — Language Technology and Data Analysis Laboratory" />
<meta name="twitter:description" content="Free, open-access tutorials, tools, and courses for language researchers at all levels." />
<meta name="twitter:image" content="https://ladal.edu.au/images/uq1.webp" />
<meta name="twitter:image:alt" content="Great Court, The University of Queensland — LADAL" />

<!-- General meta description — Quarto overrides this per-page once
     each tutorial has a top-level description: field in its YAML.
     This fallback covers the homepage and any pages without one. -->
<meta name="description" content="Free, open-access tutorials, tools, and courses for language researchers at all levels. Part of the Language Data Commons of Australia (LDaCA) at the University of Queensland." />

<!-- ============================================================

     This default block covers non-tutorial pages.
     Tutorial pages get their own richer block via an inline
     R chunk (see: helpers/schema_org_chunk_template.R).
     ============================================================ -->

  },

  ]
}
</script>
